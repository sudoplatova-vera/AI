<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая Жизнь — Инвестиционное предложение</title>
<style>
body{
margin:0;
font-family:Inter,Arial,sans-serif;
background:#071412;
color:#fff;
}
.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px;
background:
radial-gradient(circle at top left,#1bb98b33,transparent 35%),
linear-gradient(135deg,#06110f,#0d211d);
text-align:center;
}
h1{
font-size:clamp(48px,8vw,96px);
margin:0;
background:linear-gradient(90deg,#fff,#6ee7b7,#67dce6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
p{
max-width:800px;
margin:20px auto;
font-size:20px;
line-height:1.6;
color:#d7e4df;
}
.button{
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:linear-gradient(135deg,#4de0ad,#63dce6);
border-radius:40px;
color:#062019;
font-weight:bold;
text-decoration:none;
}
</style>
</head>
<body>
<section class="hero">
<div>
<h1>Новая Жизнь</h1>
<p>Современный адаптивный шаблон инвестиционного предложения. Это стартовый файл index.html. При необходимости я могу сформировать полноценный лендинг с несколькими тысячами строк кода, карточками, анимациями и встроенными изображениями.</p>
<a class="button" href="#">Подробнее</a>
</div>
</section>
</body>
</html>
